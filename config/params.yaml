# 集中管理所有可调参数。
# 用法：运行期用 OpenCV 的 cv::FileStorage 读取（零额外依赖、改完不用重编译）；
#       或临时用 config/params.h 里的 const 常量（改完需重编译）。
# 以下数值均为占位/示例，需按实际图片和视频实测后调整。

# ---- 任务1：郁金香图片处理 ----
task1:
  threshold: 128              # 全局二值化阈值
  red_low1:  [0, 100, 100]    # 红色 HSV 区间1 下界 (H,S,V)
  red_high1: [10, 255, 255]   # 红色 HSV 区间1 上界
  red_low2:  [170, 100, 100]  # 红色 HSV 区间2 下界（H 跨两端）
  red_high2: [179, 255, 255]  # 红色 HSV 区间2 上界
  morph_kernel: 5             # 形态学核尺寸（奇数）
  min_area: 500.0             # 轮廓最小面积
  ratio_min: 0.2              # 外接矩形长宽比下限
  ratio_max: 5.0              # 外接矩形长宽比上限

# ---- 任务2：合成旋转视频拟合 ----
task2:
  center: [480, 360]          # 旋转中心（已知，可改为检测）
  radius: 220                 # 半径（像素）
  fps: 60
  target_low:  [70, 100, 100] # 青色目标 HSV 范围（示例，需实测调整）
  target_high: [100, 255, 255]

# ---- 任务3：真实能量机关跟踪 ----
task3:
  lost_tolerance_frames: 15   # 丢失容忍帧数，超过则允许重选
  # 小/大机关的颜色阈值需按实际视频采样后填入
